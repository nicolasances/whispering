name: Dev Release

on:
  push:
    branches:
      - "feature/**"
      - main

jobs:
  # This workflow contains a single job called "release"
  release:
    name: Build & Deploy to Cloud run
    environment: totoexperiments
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2

      - name: Authenticate to Artifact Registry
        run: |
          echo '${{ secrets.CICD_SERVICE_ACCOUNT }}' > ./credentials.json
          gcloud auth activate-service-account --key-file=./credentials.json
          gcloud auth configure-docker europe-west1-docker.pkg.dev

      - name: Create Environment Variables
        run: |
          export PACKAGE_VERSION=1.0.0
          export PACKAGE_NAME=$(basename $GITHUB_REPOSITORY)
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> $GITHUB_ENV

      - name: Build Docker image
        run: |
          docker build . -t europe-west1-docker.pkg.dev/${{ vars.GCP_PID }}/${{env.PACKAGE_NAME}}/${{env.PACKAGE_NAME}}:${{env.PACKAGE_VERSION}}

      - name: Push Docker image to Artifact Registry
        run: |
          docker push europe-west1-docker.pkg.dev/${{ vars.GCP_PID }}/${{env.PACKAGE_NAME}}/${{env.PACKAGE_NAME}}:${{env.PACKAGE_VERSION}}

      - name: Setup GCloud
        uses: google-github-actions/setup-gcloud@v0
        with:
          project_id: ${{ vars.GCP_PID }}
          service_account_key: ${{ secrets.CICD_SERVICE_ACCOUNT }}
          export_default_credentials: true

      - name: Deploy image
        run: |
          gcloud run deploy ${{env.PACKAGE_NAME}} --set-env-vars "HYPERSCALER=gcp,ENVIRONMENT=dev,AUDIO_UPLOAD_DIR=/app/audiofiles" --service-account=${{ secrets.SERVICE_ACCOUNT }} --project=${{ vars.GCP_PID }} --image=europe-west1-docker.pkg.dev/${{ vars.GCP_PID }}/${{env.PACKAGE_NAME}}/${{env.PACKAGE_NAME}}:${{env.PACKAGE_VERSION}} --platform=managed --region=${{ vars.GCP_REGION }} --allow-unauthenticated --memory=4Gi
